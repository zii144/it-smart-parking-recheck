# Fail-closed allow-list: every route the public path is allowed to reach is
# an explicit location block. Everything else, including any future backend
# route nobody adds here on purpose, falls through to the catch-all and gets
# the connection dropped — not a 403 (which still confirms the path exists),
# not a 404 (same problem). New backend routes are private by default.

server {
    listen 8090;
    server_name _;

    # Evidence photos are sent as base64 in the JSON body; the backend caps the
    # decoded image at MAX_UPLOAD_BYTES (8 MiB default), which is ~11 MiB of
    # base64 plus JSON overhead. Without this, nginx's 1 MiB default 413s real
    # inspector submissions before they ever reach the backend. Keep in sync
    # with production/frontend/nginx.conf, which sets the same value for the
    # admin path.
    client_max_body_size 12m;

    location = /api/login {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /api/locations {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /api/qr/scan {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /api/cases {
        # Covers /api/cases, /api/cases/preview, and any /api/cases/* the
        # backend defines — explicitly excludes /api/admin/* (different
        # path prefix, doesn't match this block).
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /api/health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        return 444;
    }
}
